<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today · GDScript Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
  .page { grid-template-columns: minmax(0, 1fr) 420px; }
  .hero { display: flex; flex-direction: column; gap: 10px; }
  .runhead { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .runhead b { color: var(--text); font-weight: 500; }
  .slots { display: flex; flex-direction: column; gap: 8px; }
  .slot { display: grid; grid-template-columns: 56px minmax(0, 1fr) 120px; align-items: center; gap: 16px; padding: 16px 20px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); text-align: left; }
  .slot .n { font-family: var(--head); font-weight: 700; font-size: 22px; color: var(--accent); }
  .slot .t { font-weight: 600; } .slot .d { font-size: 13px; }
  .slot.done .t { text-decoration: line-through; }
  .slot .state { font-size: 12px; color: var(--accent); text-align: right; letter-spacing: 0.06em; }
  .slot.active { padding: 20px; border-color: var(--accent); box-shadow: 4px 4px 0 var(--accent); color: var(--text); }
  .slot.active .n { color: var(--text); } .slot.active .d { color: var(--muted); }
  .slot.active .state { padding: 10px 0; background: var(--accent); color: var(--bg); font-weight: 600; font-size: 13px; text-align: center; }
  .slot.link { cursor: pointer; } .slot.link:hover { border-color: var(--line-strong); }
  .keep { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; }
  .side { display: flex; flex-direction: column; gap: 20px; }
  .character { display: flex; flex-direction: column; gap: 14px; }
  .stage { height: 130px; background: var(--bg); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; position: relative; }
  .hp { position: absolute; left: 12px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; width: 140px; }
  .hp .l { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); }
  .hp .b { height: 8px; border: 1px solid var(--line-strong); background: var(--bg); }
  .excerpt { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .excerpt a { display: flex; justify-content: space-between; color: var(--muted); }
  .excerpt a.done { color: var(--dim); } .excerpt a.current { color: var(--text); font-weight: 600; } .excerpt a.current span:last-child { color: var(--accent); }
  .excerpt a.milestone { color: var(--milestone); padding: 6px 0; } .excerpt a.locked { color: var(--dim); }
  .doneday { padding: 14px 20px; border: 1px solid var(--accent); color: var(--accent); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
</style>
</head>
<body>
<main class="page">
  <section style="display: flex; flex-direction: column; gap: 26px; min-height: 60vh;">
    <div class="hero">
      <div class="eyebrow" id="dateline">// today</div>
      <h1>Today's run</h1>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="runhead"><span>Run progress</span><b id="runcount">– / 3</b></div>
      <div class="bar" id="runbar"><div></div><div></div><div></div></div>
      <div class="runhead" style="font-size: 12px;"><span class="muted">Full runs completed</span><b id="runsdone">–</b></div>
    </div>
    <div class="slots" id="slots"></div>
    <div class="doneday" id="doneday" hidden>Day done · streak extended. Anything more is a bonus.</div>
    <div class="keep" id="keep"></div>
  </section>

  <aside class="side">
    <div class="panel character">
      <div class="label">Player character</div>
      <div class="stage">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#2a323b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"></circle><path d="M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"></path></svg>
        <div class="hp"><div class="l">HP — NOT YET</div><div class="b"></div></div>
      </div>
      <div class="muted" style="font-size: 13px;">Milestone 1 makes the character move. Milestone 2 gives it health, and the bar fills for real.</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div class="label">Route</div>
      <div class="excerpt" id="excerpt"></div>
    </div>
  </aside>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="today.js"></script>
</body>
</html>
