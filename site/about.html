<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About · GDScript Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
  .page { grid-template-columns: 220px minmax(0, 1fr); gap: 40px; max-width: 1200px; }
  .toc { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 24px; align-self: start; font-size: 12px; }
  .toc a { color: var(--muted); padding: 4px 0; } .toc a:hover { color: var(--accent); }
  .about { max-width: 72ch; font-size: 15px; line-height: 1.7; }
  .about h1 { font-size: 44px; margin: 0 0 8px; }
  .about h2 { font-size: 22px; margin: 36px 0 10px; scroll-margin-top: 24px; }
  .about p { margin: 0 0 14px; }
  .about code { background: var(--line); color: var(--accent); padding: 1px 6px; }
  .about a { color: var(--accent); }
  .about strong { color: var(--text); }
  @media (max-width: 960px) { .toc { position: static; } }
</style>
</head>
<body>
<main class="page">
  <nav class="toc" id="toc"></nav>
  <article class="about" id="about"><h1>About</h1><p class="muted">Loading…</p></article>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="about.js"></script>
</body>
</html>
