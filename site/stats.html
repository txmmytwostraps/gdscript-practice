<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats · GDScript Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
  .page { grid-template-columns: 1fr; gap: 32px; }
  h1 { font-size: 44px; }
  .numbers { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .num { padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); }
  .num .v { font-family: var(--head); font-weight: 700; font-size: 28px; line-height: 1; margin-top: 6px; }
  .num .v.accent { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; vertical-align: top; }
  td.r, th.r { text-align: right; }
  tr.locked td { color: var(--dim); }
  .weak { display: flex; flex-direction: column; gap: 6px; }
  .weak a { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); color: var(--text); }
  .weak a:hover { border-color: var(--accent); }
  .weak .rate { color: var(--error); font-weight: 600; }
  .weeks { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 14px); gap: 3px; }
  .weeks div { width: 14px; height: 14px; background: var(--line); }
  .weeks div.on { background: var(--accent); } .weeks div.today { outline: 1px solid var(--text); }
  .weeks div.future { background: transparent; border: 1px dashed var(--line); }
  .legend { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .section { display: flex; flex-direction: column; gap: 12px; }
  .tablewrap { overflow-x: auto; }
</style>
</head>
<body>
<main class="page">
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div class="eyebrow" id="eyebrow">// stats</div>
    <h1>Stats</h1>
    <div class="muted" id="intro" style="font-size: 14px; max-width: 70ch;"></div>
  </div>
  <div class="numbers" id="numbers"></div>
  <section class="section">
    <div class="label">Weak spots — topics with the most misses in the last 30 days</div>
    <div class="weak" id="weak"></div>
  </section>
  <section class="section">
    <div class="label">Streak history — active days over the last 16 weeks</div>
    <div class="weeks" id="weeks"></div>
    <div class="legend" id="legend"></div>
  </section>
  <section class="section">
    <div class="label">Per topic</div>
    <div class="tablewrap"><table id="topics"></table></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="stats.js"></script>
</body>
</html>
