<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concepts · GDScript Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="style.css">
<style>
  .page { grid-template-columns: 240px minmax(0, 1fr); gap: 40px; }
  h1 { font-size: 44px; }
  .toc { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 24px; align-self: start; font-size: 12px; }
  .toc a { color: var(--muted); padding: 4px 0; } .toc a:hover { color: var(--accent); } .toc a.locked { color: var(--dim); }
  .lesson { display: flex; flex-direction: column; gap: 12px; margin-bottom: 36px; }
  .lesson h2 { font-size: 22px; margin: 0; }
  .lesson .sub { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 28px; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line); scroll-margin-top: 24px; }
  .card.due { border-color: var(--accent); }
  .card .name { grid-column: 1 / -1; font-family: var(--head); font-weight: 700; font-size: 18px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .card .name .state { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .card .what { font-size: 14px; line-height: 1.6; }
  .card .mistake { font-size: 13px; line-height: 1.6; color: var(--muted); border-left: 2px solid var(--error); padding-left: 12px; }
  .card .example { font-size: 13px; line-height: 1.6; color: var(--muted); }
  .card pre.code { font-size: 13px; }
  .card .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
  .flash { display: flex; flex-direction: column; gap: 18px; max-width: 70ch; }
  .flash .front { font-family: var(--head); font-weight: 700; font-size: 26px; }
  .flash .back { display: flex; flex-direction: column; gap: 12px; }
  .flash .actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .flash .progress { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .modebar { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; }
  @media (max-width: 960px) { .card { grid-template-columns: 1fr; } .toc { position: static; } }
  @media (min-width: 1700px) { .page { grid-template-columns: 280px minmax(0, 1fr); } .cards-wide { columns: 2; column-gap: 24px; } .cards-wide .card { break-inside: avoid; margin-bottom: 12px; } }
</style>
</head>
<body>
<main class="page">
  <nav class="toc" id="toc"></nav>
  <div>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px;">
      <div class="eyebrow" id="eyebrow">// concepts</div>
      <h1 id="title">Concepts</h1>
      <div class="muted" id="intro" style="font-size: 14px; max-width: 70ch;">One card per concept, in lesson order: what it is, how you write it, an example, and the mistake beginners make.</div>
      <div class="modebar caps" id="modebar"></div>
    </div>
    <div id="flash" class="flash" hidden></div>
    <div id="reference"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="concepts.js"></script>
</body>
</html>
